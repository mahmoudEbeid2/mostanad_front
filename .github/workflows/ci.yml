name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # no hard-coded UI text, every English string has its Arabic (UI plan, Phase A §4)
      - run: npm run lint:i18n
      # the main screens: no Arabic in English, no English in Arabic
      - run: npm test
      - run: npm run build
